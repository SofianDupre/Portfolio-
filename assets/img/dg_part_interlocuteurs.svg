<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 382" width="1000" height="382"><rect width="1000" height="382" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Les cinq interlocuteurs du quotidien</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">La relation tripartite agence – candidat – entreprise, vue depuis le poste de stagiaire commercial.</text><rect x="30" y="100" width="180" height="214" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="120" cy="134" r="17" fill="#123A63"/><text x="120.0" y="140" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">1</text><text x="120.0" y="176" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Clients déjà en</text><text x="120.0" y="196" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">collaboration</text><text x="120.0" y="226" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Entreprises partenaires</text><text x="120.0" y="243" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">fidèles : missions</text><text x="120.0" y="260" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">ponctuelles,</text><text x="120.0" y="277" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">remplacements, surcroîts</text><text x="120.0" y="294" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">saisonniers.</text><rect x="226" y="100" width="180" height="214" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="316" cy="134" r="17" fill="#123A63"/><text x="316.0" y="140" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">2</text><text x="316.0" y="176" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Clients potentiels</text><text x="316.0" y="206" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Prospects ciblés par la</text><text x="316.0" y="223" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">prospection : industrie,</text><text x="316.0" y="240" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">logistique, tertiaire,</text><text x="316.0" y="257" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">hôtellerie-restauration.</text><rect x="422" y="100" width="180" height="214" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="512" cy="134" r="17" fill="#123A63"/><text x="512.0" y="140" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">3</text><text x="512.0" y="176" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Candidats</text><text x="512.0" y="206" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Postulants aux annonces,</text><text x="512.0" y="223" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">candidatures spontanées</text><text x="512.0" y="240" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">et visites directes à</text><text x="512.0" y="257" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">l’agence.</text><rect x="618" y="100" width="180" height="214" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="708" cy="134" r="17" fill="#123A63"/><text x="708.0" y="140" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">4</text><text x="708.0" y="176" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">Équipe interne</text><text x="708.0" y="206" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Responsable d’agence,</text><text x="708.0" y="223" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">chargés de recrutement</text><text x="708.0" y="240" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">et assistante</text><text x="708.0" y="257" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">administrative.</text><rect x="814" y="100" width="180" height="214" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><circle cx="904" cy="134" r="17" fill="#123A63"/><text x="904.0" y="140" font-family="Poppins, Lato, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">5</text><text x="904.0" y="176" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">RH, managers et</text><text x="904.0" y="196" font-family="Lato, sans-serif" font-size="14.5" font-weight="600" fill="#123A63" text-anchor="middle">accueil</text><text x="904.0" y="226" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">Interlocuteurs au sein</text><text x="904.0" y="243" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">des entreprises</text><text x="904.0" y="260" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">clientes, qui précisent</text><text x="904.0" y="277" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="middle">les besoins réels.</text><text x="30" y="364" font-family="Lato, sans-serif" font-size="12.5" font-weight="400" fill="#56687D" text-anchor="start">Adapter le discours à chacun a été l’apprentissage relationnel majeur de ce stage.</text></svg>