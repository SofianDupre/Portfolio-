<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452"><rect width="1000" height="452" fill="white"/><text x="30" y="40" font-family="Poppins, Lato, sans-serif" font-size="21" font-weight="600" fill="#123A63" text-anchor="start">Le Groupe Partnaire en quelques chiffres</text><line x1="30" y1="54" x2="970" y2="54" stroke="#DCE5EF" stroke-width="2"/><text x="30" y="76" font-family="Lato, sans-serif" font-size="14" font-weight="400" fill="#56687D" text-anchor="start">Entreprise française de services en ressources humaines, fondée en 1952 à Orléans. Chiffres de l’exercice 2023.</text><rect x="30" y="100" width="218" height="118" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><text x="139.0" y="156" font-family="Poppins, Lato, sans-serif" font-size="30" font-weight="700" fill="#123A63" text-anchor="middle">267</text><text x="139.0" y="182" font-family="Lato, sans-serif" font-size="13" font-weight="400" fill="#56687D" text-anchor="middle">agences en Europe</text><rect x="270" y="100" width="218" height="118" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><text x="379.0" y="156" font-family="Poppins, Lato, sans-serif" font-size="30" font-weight="700" fill="#123A63" text-anchor="middle">980+</text><text x="379.0" y="182" font-family="Lato, sans-serif" font-size="13" font-weight="400" fill="#56687D" text-anchor="middle">collaborateurs permanents</text><rect x="510" y="100" width="218" height="118" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><text x="619.0" y="156" font-family="Poppins, Lato, sans-serif" font-size="30" font-weight="700" fill="#123A63" text-anchor="middle">602 M€</text><text x="619.0" y="182" font-family="Lato, sans-serif" font-size="13" font-weight="400" fill="#56687D" text-anchor="middle">de chiffre d’affaires</text><rect x="750" y="100" width="218" height="118" rx="10" fill="#F4F7FA" stroke="#DCE5EF" stroke-width="1.5"/><text x="859.0" y="156" font-family="Poppins, Lato, sans-serif"